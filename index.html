    display: grid;
    place-items: center;
    width: 35px;
    min-height: 38px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #744f3d;
  }
  #htt-market .hero-dot::after {
    width: 6px;
    height: 6px;
    border-radius: 4px;
    background: #b9a496;
    content: &quot;&quot;;
  }
  #htt-market .hero-dot[aria-current=&quot;true&quot;]::after { width: 15px; background: var(--brand); }
  #htt-market .hero-control span {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 1px solid #ebdbc9;
    border-radius: 50%;
    background: var(--paper);
    font: 16px/1 &quot;Geist&quot;, &quot;PingFang SC&quot;, sans-serif;
  }
  #htt-market .hero-control[aria-disabled=&quot;true&quot;] { opacity: .4; }
  #htt-market [data-hero-play] span { font-size: 10px; }
  #htt-market [data-lucide], #htt-market .lucide { display: block; width: 17px; height: 17px; }
  #htt-market .launch-action :is(i, .lucide) { width: 13px; height: 13px; }
  #htt-market i[data-lucide] { position: relative; font-style: normal; }
  #htt-market i[data-lucide]::before, #htt-market i[data-lucide]::after {
    position: absolute;
    box-sizing: border-box;
    content: &quot;&quot;;
  }
  #htt-market i[data-lucide=&quot;arrow-right&quot;]::before { content: &quot;→&quot;; inset: 0; line-height: 13px; }
  #htt-market i[data-lucide=&quot;layout-grid&quot;]::before {
    top: 2px;
    left: 2px;
    width: 5px;
    height: 5px;
    border-radius: 1px;
    background: currentColor;
    box-shadow: 8px 0 currentColor, 0 8px currentColor, 8px 8px currentColor;
  }
  #htt-market i[data-lucide=&quot;house&quot;]::before {
    inset: 6px 3px 2px;
    border: 1.5px solid;
    border-top: 0;
    border-radius: 0 0 2px 2px;
  }
  #htt-market i[data-lucide=&quot;house&quot;]::after {
    top: 2px;
    left: 4px;
    width: 9px;
    height: 9px;
    border: 1.5px solid;
    border-right: 0;
    border-bottom: 0;
    transform: rotate(45deg);
  }
  #htt-market i[data-lucide=&quot;shopping-cart&quot;]::before {
    inset: 4px 2px 6px;
    border: 1.5px solid;
    border-radius: 1px 1px 3px 3px;
    transform: skewX(-10deg);
  }
  #htt-market i[data-lucide=&quot;shopping-cart&quot;]::after {
    bottom: 2px;
    left: 4px;
    width: 2.5px;
    height: 2.5px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 7px 0 currentColor;
  }
  #htt-market i[data-lucide=&quot;user-round&quot;]::before {
    inset: 1px 5px 9px;
    border: 1.5px solid;
    border-radius: 50%;
  }
  #htt-market i[data-lucide=&quot;user-round&quot;]::after {
    inset: 10px 2px 1px;
    border: 1.5px solid;
    border-radius: 6px 6px 2px 2px;
  }
  #htt-market i[data-lucide=&quot;lock-keyhole&quot;]::before {
    inset: 7px 3px 2px;
    border: 1.5px solid;
    border-radius: 2px;
  }
  #htt-market i[data-lucide=&quot;lock-keyhole&quot;]::after {
    inset: 3px 5px 10px;
    border: 1.5px solid;
    border-bottom: 0;
    border-radius: 5px 5px 0 0;
  }
  #htt-market .login-prompt {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    margin-top: 3px;
    padding: 0 10px;
    border: 1px solid #f0dfd1;
    border-radius: 8px;
    background: #fff4ea;
    color: #783b26;
    text-align: left;
  }
  #htt-market .login-prompt .arrow { margin-left: auto; }
  #htt-market .login-prompt .lucide { width: 14px; height: 14px; }
  #htt-market .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 5px;
    margin-bottom: 2px;
  }
  #htt-market .section-head h2 { font-size: 18px; font-weight: 650; letter-spacing: -.025em; }
  #htt-market .section-head .flat { color: var(--brand); }
  #htt-market .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
  }
  #htt-market .product {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--white);
    text-align: left;
    overflow: hidden;
  }
  #htt-market .product img,
  #htt-market .detail-photo {
    display: block;
    width: 100%;
    object-fit: cover;
    background: var(--wash);
    filter: saturate(.94);
  }
  #htt-market .product img { aspect-ratio: 1.25; }
  #htt-market .product-text {
    display: flex;
    flex: 1;
    flex-direction: column;
    width: 100%;
    min-width: 0;
    gap: 4px;
    padding: 8px 9px 9px;
  }
  #htt-market .product-name { font-weight: 650; font-size: 14px; line-height: 1.4; }
  #htt-market .meta {
    font: 11px/1.45 var(--mono);
    color: var(--secondary);
    overflow-wrap: anywhere;
  }
  #htt-market .sku-label { font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif; margin-right: 4px; }
  #htt-market .product-attribute { font-size: 11px; color: var(--secondary); }
  #htt-market .price-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: auto;
    min-height: 21px;
    font-size: 12px;
    font-weight: 650;
  }
  #htt-market .price-row [data-price] { color: var(--brand); }
  #htt-market .stock {
    padding: 2px 6px;
    border-radius: 999px;
    background: var(--stock-wash);
    color: var(--stock);
    font-size: 11px;
    font-weight: 550;
    line-height: 1.4;
  }
  #htt-market .purchase-guide {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    border-top: 1px solid var(--line);
    color: var(--secondary);
  }
  #htt-market .nav {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    padding: 4px 6px 6px;
    border-top: 1px solid var(--line);
    background: var(--paper);
  }
  #htt-market .nav-item {
    position: relative;
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 3px;
    min-height: 46px;
    padding: 2px;
    color: var(--secondary);
    font-size: 11px;
  }
  #htt-market .nav-item[aria-current] { color: var(--brand); font-weight: 700; }
  #htt-market .nav-item .lucide { width: 18px; height: 18px; }
  #htt-market .catalog-header { margin-bottom: 13px; }
  #htt-market .catalog-header .title {
    margin-bottom: 11px;
    font-size: 23px;
    line-height: 1.3;
    letter-spacing: -.025em;
  }
  #htt-market .catalog-columns {
    display: grid;
    grid-template-columns: 132px minmax(0, 1fr);
    gap: 10px;
  }
  #htt-market .category-rail {
    align-self: start;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
  }
  #htt-market .filter {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    min-height: 44px;
    padding: 6px 5px 6px 7px;
    border-left: 2px solid transparent;
    text-align: left;
    font-size: 12px;
    line-height: 1.35;
    color: var(--secondary);
  }
  #htt-market .filter + .filter { border-top: 1px solid var(--line); }
  #htt-market .filter[aria-pressed=&quot;true&quot;] {
    border-left-color: var(--brand);
    background: var(--brand-wash);
    color: var(--brand);
    font-weight: 650;
  }
  #htt-market .filter:focus-visible { outline-offset: -2px; }
  #htt-market .category-icon {
    display: block;
    flex: 0 0 17px;
    width: 17px;
    height: 17px;
    background-color: currentColor;
    mask: var(--category-icon) center / contain no-repeat;
  }

  #htt-market .result-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px;
    min-height: 36px;
    margin-bottom: 6px;
  }
  #htt-market .result-head h2 { font-size: 14px; font-weight: 650; }
  #htt-market .quiet { color: var(--secondary); font-size: 12px; }
  #htt-market .clear-query {
    padding: 0 8px;
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--white);
  }
  #htt-market .list { display: grid; gap: 7px; }
  #htt-market .list .product { display: grid; grid-template-columns: 67px minmax(0, 1fr); }
  #htt-market .list .product img { width: 67px; height: 100%; min-height: 86px; aspect-ratio: auto; }
  #htt-market .list .product-text { padding: 8px; gap: 3px; }
  #htt-market .list .product-name { font-size: 12px; }
  #htt-market .list .price-row { font-size: 11px; }
  #htt-market .detail-page { padding-top: 7px; }
  #htt-market .back { margin-bottom: 8px; color: var(--secondary); }
  #htt-market .detail-photo {
    aspect-ratio: 1.29;
    border: 1px solid var(--line);
    border-radius: 9px;
    object-fit: contain;
    background: var(--wash);
  }
  #htt-market .detail-title { margin-top: 18px; }
  #htt-market .detail-title h1 { font-size: clamp(22px, 4vw, 27px); font-weight: 650; line-height: 1.3; letter-spacing: -.03em; }
  #htt-market .detail-title .meta { margin-top: 7px; }
  #htt-market .spec {
    display: grid;
    grid-template-columns: 74px minmax(0, 1fr);
    gap: 0;
    margin: 17px 0 19px;
    border-top: 1px solid var(--line);
    font-size: 13px;
  }
  #htt-market .spec dt, #htt-market .spec dd {
    min-height: 37px;
    display: flex;
    align-items: center;
    margin: 0;
    border-bottom: 1px solid var(--line);
  }
  #htt-market .spec dt { color: var(--secondary); }
  #htt-market .primary {
    min-height: 44px;
    padding: 7px 12px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: var(--brand);
    color: var(--white);
    font-weight: 600;
  }
  #htt-market .primary:active { transform: scale(.99); }
  #htt-market .detail-action { width: 100%; }
  #htt-market .account-content {
    margin-top: 28px;
    padding: 22px 17px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--white);
  }
  #htt-market .account-content p { margin-bottom: 14px; }
  #htt-market .account-content .quiet { margin-top: 13px; margin-bottom: 0; }
  #htt-market .sheet {
    width: min(348px, calc(100% - 32px));
    max-height: 90%;
    padding: 19px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--white);
    color: var(--ink);
  }
  #htt-market .sheet::backdrop { background: #24231f64; }
  #htt-market .sheet h2 { font-size: 18px; }
  #htt-market .sheet p { margin-top: 8px; color: var(--secondary); }
  #htt-market .sheet-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  @media (hover: hover) {
    #htt-market .launch:hover,
    #htt-market .product:hover { box-shadow: 0 2px 8px #24231f0a; }
    #htt-market .flat:hover,
    #htt-market .filter:hover { color: var(--brand); }
    #htt-market .search .flat:hover { background: #893819; color: var(--white); }
  }
  @media (max-width: 375px) {
    #htt-market .phone { border-radius: 14px; }
    #htt-market .page, #htt-market .top { padding-inline: 13px; }
    #htt-market .catalog-columns { grid-template-columns: 120px minmax(0, 1fr); gap: 7px; }
    #htt-market .list .product { grid-template-columns: 59px minmax(0, 1fr); }
    #htt-market .list .product img { width: 59px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    #htt-market .entered { animation: htt-market-arrival 240ms cubic-bezier(.16, 1, .3, 1) both; }
    @keyframes htt-market-arrival {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }

];
  const panels = [...root.querySelectorAll(&quot;[data-view]&quot;)];
  const nav = [...root.querySelectorAll(&quot;.nav-item&quot;)];
  const searches = [...root.querySelectorAll(&quot;[data-search]&quot;)];
  const filters = [...root.querySelectorAll(&quot;[data-filters] button&quot;)];
  const categories = {
    all: &quot;全部商品&quot;,
    ...Object.fromEntries(filters.map((button) =&gt; [button.dataset.filter, button.textContent.trim()])),
  };
  const template = root.querySelector(&quot;[data-product-template]&quot;);
  const popup = root.querySelector(&quot;dialog&quot;);
  const results = root.querySelector(&quot;[data-results]&quot;);
  const empty = root.querySelector(&quot;[data-empty]&quot;);
  let state = { page: &quot;home&quot;, category: &quot;all&quot;, query: &quot;&quot;, product: &quot;&quot;, from: &quot;home&quot; };
  let previousFocus = null;

  function productCard(item) {
    const card = template.content.firstElementChild.cloneNode(true);
    card.dataset.product = item.sku;
    card.querySelector(&quot;img&quot;).src = item.image;
    card.querySelector(&quot;.product-name&quot;).textContent = item.name;
    card.querySelector(&quot;[data-sku]&quot;).textContent = item.sku;
    card.querySelector(&quot;[data-price]&quot;).textContent = item.price;
    card.querySelector(&quot;.stock&quot;).hidden = !item.inStock;
    if (item.spec) {
      const spec = card.querySelector(&quot;[data-card-spec]&quot;);
      spec.textContent = item.spec.join(&quot; &quot;);
      spec.hidden = false;
    }
    return card;
  }

  function renderCatalog() {
    const query = state.query.toLowerCase();
    const visible = products.filter((item) =&gt; {
      if (query) return (item.name + &quot; &quot; + item.sku).toLowerCase().includes(query);
      if (state.category === &quot;all&quot;) return true;
      if (state.category === &quot;new&quot;) return item.isNew;
      if (state.category === &quot;special&quot;) return item.isSpecial;
      return item.category === state.category;
    });
    searches[1].querySelector(&quot;input&quot;).value = state.query;
    root.querySelector(&quot;[data-clear]&quot;).hidden = !state.query;
    root.querySelector(&quot;[data-filter-title]&quot;).textContent = query ? &quot;搜索结果&quot; : categories[state.category];
    root.querySelector(&quot;[data-result-size]&quot;).textContent = visible.length + &quot; 件商品&quot;;
    filters.forEach((button) =&gt; button.setAttribute(&quot;aria-pressed&quot;, String(!query &amp;&amp; button.dataset.filter === state.category)));
    results.replaceChildren(...visible.map(productCard));
    empty.hidden = visible.length &gt; 0;
    empty.textContent = query ? &quot;没有匹配的商品，请换个品名或货号试试。&quot; : &quot;本次设计稿暂无该分类的商品样例。&quot;;
  }

  function renderDetail() {
    const item = products.find((entry) =&gt; entry.sku === state.product);
    if (!item) return;
    const photo = root.querySelector(&quot;[data-detail-photo]&quot;);
    photo.src = item.image;
    photo.alt = item.name;
    root.querySelector(&quot;#htt-detail-title&quot;).textContent = item.name;
    root.querySelector(&quot;[data-detail-sku]&quot;).textContent = &quot;货号 &quot; + item.sku;
    const rows = [];
    if (categories[item.category]) rows.push([&quot;分类&quot;, categories[item.category]]);
    if (item.spec) rows.push(item.spec);
    if (item.inStock) rows.push([&quot;库存&quot;, &quot;有货&quot;]);
    rows.push([&quot;采购价&quot;, item.price]);
    const terms = rows.flatMap(([key, value]) =&gt; {
      const dt = document.createElement(&quot;dt&quot;);
      const dd = document.createElement(&quot;dd&quot;);
      dt.textContent = key;
      dd.textContent = value;
      return [dt, dd];
    });
    root.querySelector(&quot;[data-detail-spec]&quot;).replaceChildren(...terms);
  }

  function initializeHeroCarousel(carousel) {
    const viewport = carousel.querySelector(&quot;[data-hero-viewport]&quot;);
    const slides = [...viewport.children];
    const dots = [...carousel.querySelectorAll(&quot;[data-hero-dot]&quot;)];
    const previous = carousel.querySelector(&quot;[data-hero-prev]&quot;);
    const next = carousel.querySelector(&quot;[data-hero-next]&quot;);
    const playback = carousel.querySelector(&quot;[data-hero-play]&quot;);
    const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
    let activeIndex = -1;
    let playing = !reducedMotion.matches;
    let timer;

    function reflectPosition() {
      const width = viewport.clientWidth;
      if (!width) return;
      const index = Math.max(0, Math.min(slides.length - 1, Math.round(viewport.scrollLeft / width)));
      if (index === activeIndex) return;
      activeIndex = index;
      slides.forEach((slide, slideIndex) =&gt; {
        slide.inert = slideIndex !== activeIndex;
        const dot = dots[slideIndex];
        if (slideIndex === activeIndex) dot.setAttribute(&quot;aria-current&quot;, &quot;true&quot;);
        else dot.removeAttribute(&quot;aria-current&quot;);
      });
      previous.setAttribute(&quot;aria-disabled&quot;, String(activeIndex === 0));
      next.setAttribute(&quot;aria-disabled&quot;, String(activeIndex === slides.length - 1));
    }

    function goTo(index, smooth = true) {
      if (index &lt; 0 || index &gt;= slides.length || index === activeIndex) return;
      viewport.scrollTo({
        left: viewport.clientWidth * index,
        behavior: !smooth || reducedMotion.matches ? &quot;instant&quot; : &quot;smooth&quot;,
      });
    }

    function schedule() {
      window.clearTimeout(timer);
      if (!playing || document.hidden || !viewport.clientWidth) return;
      timer = window.setTimeout(() =&gt; {
        const index = (activeIndex + 1) % slides.length;
        goTo(index, index !== 0);
        schedule();
      }, 6500);
    }

    function setPlaying(value) {
      playing = value &amp;&amp; !reducedMotion.matches;
      playback.hidden = reducedMotion.matches;
      playback.setAttribute(&quot;aria-label&quot;, playing ? &quot;暂停轮播&quot; : &quot;播放轮播&quot;);
      playback.firstElementChild.textContent = playing ? &quot;Ⅱ&quot; : &quot;▶&quot;;
      schedule();
    }

    function select(index) {
      setPlaying(false);
      goTo(index);
    }

    dots.forEach((dot, index) =&gt; dot.addEventListener(&quot;click&quot;, () =&gt; select(index)));
    previous.addEventListener(&quot;click&quot;, () =&gt; select(activeIndex - 1));
    next.addEventListener(&quot;click&quot;, () =&gt; select(activeIndex + 1));
    playback.addEventListener(&quot;click&quot;, () =&gt; setPlaying(!playing));
    viewport.addEventListener(&quot;scroll&quot;, reflectPosition, { passive: true });
    viewport.addEventListener(&quot;pointerdown&quot;, () =&gt; setPlaying(false), { passive: true });
    viewport.addEventListener(&quot;wheel&quot;, (event) =&gt; {
      if (Math.abs(event.deltaX) &gt; Math.abs(event.deltaY)) setPlaying(false);
    }, { passive: true });
    carousel.addEventListener(&quot;focusin&quot;, (event) =&gt; {
      if (event.target !== playback) setPlaying(false);
    });
    carousel.addEventListener(&quot;keydown&quot;, (event) =&gt; {
      if (event.key === &quot;ArrowLeft&quot;) select(activeIndex - 1);
      else if (event.key === &quot;ArrowRight&quot;) select(activeIndex + 1);
      else if (event.key === &quot;Home&quot;) select(0);
      else if (event.key === &quot;End&quot;) select(slides.length - 1);
      else return;
      event.preventDefault();
    });
    document.addEventListener(&quot;visibilitychange&quot;, schedule);
    reducedMotion.addEventListener(&quot;change&quot;, () =&gt; setPlaying(playing));

    let previousWidth = 0;
    new ResizeObserver(() =&gt; {
      const width = viewport.clientWidth;
      if (width === previousWidth) return;
      previousWidth = width;
      if (width &amp;&amp; activeIndex &gt;= 0) viewport.scrollLeft = width * activeIndex;
      reflectPosition();
      schedule();
    }).observe(viewport);
    reflectPosition();
    setPlaying(playing);
    return schedule;
  }

  function render() {
    if (state.page === &quot;catalog&quot;) renderCatalog();
    if (state.page === &quot;detail&quot;) renderDetail();
    panels.forEach((panel) =&gt; {
      const show = panel.dataset.view === state.page;
      const entering = show &amp;&amp; panel.hidden;
      panel.hidden = !show;
      if (entering) {
        panel.classList.remove(&quot;entered&quot;);
        requestAnimationFrame(() =&gt; {
          if (!panel.hidden) panel.classList.add(&quot;entered&quot;);
        });
      }
    });
    const active = state.page === &quot;detail&quot; ? state.from : state.page;
    nav.forEach((button) =&gt; {
      if (button.dataset.go === active) button.setAttribute(&quot;aria-current&quot;, &quot;page&quot;);
      else button.removeAttribute(&quot;aria-current&quot;);
    });
    scheduleHero();
  }

  function update(changes) {
    Object.assign(state, changes);
    render();
    window.openai?.setWidgetState?.({
      modelContent: null,
      privateContent: { page: state.page, category: state.category, product: state.product, from: state.from },

  function restore(snapshot) {
    const saved = snapshot?.privateContent ?? snapshot;
    if (!saved || !panels.some((panel) =&gt; panel.dataset.view === saved.page)) return;
    if (saved.page === &quot;detail&quot; &amp;&amp; !products.some((item) =&gt; item.sku === saved.product)) return;
    // The host echoes local saves. Keep the unsaved search term on those echoes.
    if (saved.page === state.page &amp;&amp; saved.category === state.category
      &amp;&amp; saved.product === state.product &amp;&amp; saved.from === state.from) return;
    state = {
      page: saved.page,
      category: Object.hasOwn(categories, saved.category) ? saved.category : &quot;all&quot;,
      query: &quot;&quot;,
      product: saved.product,
      from: saved.from === &quot;catalog&quot; ? &quot;catalog&quot; : &quot;home&quot;,
    };
    render();
  }

  searches.forEach((form) =&gt; {
    const input = form.querySelector(&quot;input&quot;);
    function search() {
      const query = input.value.trim();
      if (!query) {
        input.focus();
        return;
      }
      if (form === searches[0]) input.value = &quot;&quot;;
      update({ page: &quot;catalog&quot;, category: &quot;all&quot;, query });

    form.addEventListener(&quot;submit&quot;, (event) =&gt; event.preventDefault());
    form.querySelector(&quot;button&quot;).addEventListener(&quot;click&quot;, search);
    input.addEventListener(&quot;keydown&quot;, (event) =&gt; {
      if (event.key === &quot;Enter&quot; &amp;&amp; !event.isComposing) {
        event.preventDefault();
        search();
      }

  root.addEventListener(&quot;click&quot;, (event) =&gt; {

    const { go, filter, product, dialog } = button.dataset;
    if (go) {
